<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17332d">
    <title>School Admin | Endeavour International</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --page: #f3f5f0;
            --surface: #ffffff;
            --surface-soft: #f8f9f6;
            --ink: #182622;
            --muted: #78827c;
            --line: #e7ebe5;
            --green: #17332d;
            --green-soft: #e8f0eb;
            --gold: #e3a83e;
            --gold-soft: #fbf2df;
            --red: #bd554b;
            --shadow: 0 10px 32px rgba(26, 48, 38, .055);
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--page); color: var(--ink); font: 14px 'DM Sans', sans-serif; }
        body.dark {
            color-scheme: dark;
            --page: #121b18;
            --surface: #1b2823;
            --surface-soft: #22312b;
            --ink: #edf2ed;
            --muted: #a1afa6;
            --line: #314139;
            --green-soft: #2a4036;
            --gold-soft: #453b27;
            --shadow: 0 10px 32px rgba(0, 0, 0, .16);
        }
        button, input, select, textarea { font: inherit; }
        button { cursor: pointer; }
        .app-shell { min-height: 100vh; }
        .sidebar {
            position: fixed; inset: 0 auto 0 0; z-index: 5; display: flex; width: 248px; flex-direction: column;
            padding: 25px 16px 18px; background: var(--green); color: #f5f4ec;
        }
        .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px 31px; color: inherit; text-decoration: none; }
        .brand-mark { display: grid; width: 39px; height: 39px; place-items: center; border-radius: 11px; background: var(--gold); color: #172a24; font-size: 19px; }
        .brand-name { font: 800 14px Manrope, sans-serif; line-height: 1.2; }
        .brand-caption { margin-top: 4px; color: #b8c7bd; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
        .nav-label { padding: 0 12px 10px; color: #a6b8ad; font-size: 10px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
        .nav-list { display: grid; gap: 5px; }
        .nav-link { display: flex; min-height: 43px; align-items: center; gap: 12px; border: 0; border-radius: 8px; padding: 0 12px; background: transparent; color: #d8e1da; text-align: left; transition: background .18s, color .18s; }
        .nav-link:hover, .nav-link.active { background: #29473d; color: #fff; }
        .nav-icon { display: inline-grid; width: 20px; place-items: center; color: #e8b453; font-size: 16px; }
        .sidebar-bottom { margin-top: auto; border-top: 1px solid rgba(255,255,255,.12); padding: 17px 8px 0; }
        .admin-profile { display: flex; align-items: center; gap: 10px; padding: 7px 4px; }
        .avatar { display: grid; width: 34px; height: 34px; flex: 0 0 auto; place-items: center; border-radius: 50%; background: #d9e5d8; color: var(--green); font-weight: 700; }
        .profile-name { font-size: 12px; font-weight: 700; }
        .profile-role { margin-top: 3px; color: #b8c7bd; font-size: 11px; }
        .main-area { min-height: 100vh; margin-left: 248px; }
        .topbar { position: sticky; top: 0; z-index: 4; display: flex; height: 72px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 0 38px; background: var(--surface); }
        .breadcrumb { color: var(--muted); font-size: 12px; }
        .top-actions { display: flex; align-items: center; gap: 12px; }
        .icon-button { display: grid; width: 38px; height: 38px; place-items: center; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); font-size: 16px; }
        .icon-button:hover { background: var(--surface-soft); }
        .content { width: min(1320px, 100%); margin: 0 auto; padding: 34px 38px 48px; }
        .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
        .eyebrow { margin: 0 0 7px; color: #9a762f; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
        h1, h2, h3, p { margin-top: 0; }
        h1 { margin-bottom: 5px; font: 800 27px Manrope, sans-serif; letter-spacing: 0; }
        .subtitle { margin: 0; color: var(--muted); font-size: 13px; }
        .button { display: inline-flex; min-height: 39px; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 7px; padding: 0 14px; background: var(--green); color: #fff; font-weight: 700; transition: transform .16s, background .16s; }
        .button:hover { transform: translateY(-1px); background: #25483d; }
        .button.secondary { border-color: var(--line); background: var(--surface); color: var(--ink); }
        .button.secondary:hover { background: var(--surface-soft); }
        .button.gold { background: var(--gold); color: #292619; }
        .button.gold:hover { background: #edb852; }
        .button.small { min-height: 31px; padding: 0 10px; font-size: 12px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 15px; margin-bottom: 18px; }
        .stat-card, .panel, .event-card { border: 1px solid var(--line); border-radius: 9px; background: var(--surface); box-shadow: var(--shadow); }
        .stat-card { display: flex; min-height: 126px; align-items: flex-start; justify-content: space-between; padding: 19px; cursor: pointer; transition: transform .18s, border-color .18s; }
        .stat-card:hover { transform: translateY(-3px); border-color: #c5d4c8; }
        .stat-label { color: var(--muted); font-size: 12px; font-weight: 600; }
        .stat-value { margin: 12px 0 4px; font: 800 26px Manrope, sans-serif; }
        .stat-note { color: var(--muted); font-size: 11px; }
        .stat-icon { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 9px; background: var(--green-soft); color: var(--green); font-size: 16px; }
        .stat-card:nth-child(2) .stat-icon { background: var(--gold-soft); color: #9a762f; }
        .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(270px, .85fr); gap: 17px; }
        .panel { overflow: hidden; }
        .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding: 17px 19px; }
        .panel-heading h2 { margin: 0; font: 700 14px Manrope, sans-serif; }
        .panel-heading p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
        .panel-body { padding: 18px 19px; }
        .chart { display: flex; height: 190px; align-items: end; gap: 12px; padding: 15px 3px 0; }
        .chart-column { display: flex; height: 100%; flex: 1; flex-direction: column; justify-content: end; align-items: center; gap: 8px; color: var(--muted); font-size: 10px; }
        .chart-bar { width: min(34px, 72%); min-height: 8px; border-radius: 5px 5px 2px 2px; background: #aac5b0; transition: height .6s ease; }
        .chart-column:nth-child(4n+2) .chart-bar { background: #e6b857; }
        .chart-column:nth-child(4n+3) .chart-bar { background: #739887; }
        .chart-column:nth-child(4n) .chart-bar { background: #d7a76a; }
        .activity-list { display: grid; gap: 0; }
        .activity-item { display: flex; align-items: flex-start; gap: 11px; border-bottom: 1px solid var(--line); padding: 13px 0; }
        .activity-item:last-child { border-bottom: 0; padding-bottom: 0; }
        .activity-dot { width: 8px; height: 8px; flex: 0 0 auto; margin-top: 5px; border-radius: 50%; background: var(--gold); }
        .activity-copy { min-width: 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
        .activity-copy strong { display: block; color: var(--ink); font-size: 12px; }
        .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 11px; padding: 14px 17px; }
        .toolbar-group { display: flex; flex-wrap: wrap; gap: 9px; }
        .field-control { min-height: 37px; border: 1px solid var(--line); border-radius: 7px; padding: 0 11px; outline: none; background: var(--surface); color: var(--ink); }
        .field-control:focus, textarea:focus { border-color: #668779; box-shadow: 0 0 0 3px rgba(89, 131, 108, .13); }
        .search-control { width: min(280px, 100%); }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
        th { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 11px 16px; background: var(--surface-soft); color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
        td { border-bottom: 1px solid var(--line); padding: 13px 16px; font-size: 12px; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover { background: var(--surface-soft); }
        .person-cell { display: flex; align-items: center; gap: 9px; }
        .person-cell .avatar { width: 31px; height: 31px; font-size: 11px; }
        .cell-main { font-weight: 700; }
        .cell-sub { margin-top: 3px; color: var(--muted); font-size: 10px; }
        .status-select { min-height: 29px; border: 1px solid var(--line); border-radius: 999px; padding: 0 9px; background: var(--surface); color: var(--ink); font-size: 11px; }
        .text-button { border: 0; padding: 5px; background: transparent; color: #547565; font-size: 12px; font-weight: 700; }
        .text-button:hover { color: #a67b26; }
        .empty-state { padding: 44px 15px; color: var(--muted); text-align: center; }
        .event-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }
        .event-card { padding: 18px; }
        .event-date { display: inline-block; margin-bottom: 15px; border-radius: 6px; padding: 7px 9px; background: var(--gold-soft); color: #8b6727; font-size: 11px; font-weight: 700; }
        .event-card h2 { margin-bottom: 7px; font: 700 15px Manrope, sans-serif; }
        .event-card p { margin-bottom: 15px; color: var(--muted); font-size: 12px; line-height: 1.55; }
        .event-card .text-button { padding-left: 0; color: var(--red); }
        .notice { margin: 18px 0 0; border-left: 3px solid var(--gold); padding: 9px 12px; color: var(--muted); font-size: 11px; line-height: 1.5; }
        dialog { width: min(510px, calc(100% - 28px)); max-height: min(88vh, 760px); overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--surface); color: var(--ink); box-shadow: 0 24px 80px rgba(0,0,0,.24); }
        dialog::backdrop { background: rgba(14, 27, 23, .58); backdrop-filter: blur(3px); }
        .dialog-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; border-bottom: 1px solid var(--line); padding: 19px 21px; }
        .dialog-heading h2 { margin: 0; font: 700 17px Manrope, sans-serif; }
        .dialog-heading p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
        .dialog-content { display: grid; gap: 14px; padding: 20px 21px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
        .form-field { display: grid; gap: 6px; }
        .form-field.full { grid-column: 1 / -1; }
        .form-field label { color: var(--muted); font-size: 11px; font-weight: 700; }
        .form-field input, .form-field select, .form-field textarea { width: 100%; min-height: 39px; border: 1px solid var(--line); border-radius: 7px; padding: 9px 10px; outline: none; background: var(--surface); color: var(--ink); }
        .form-field textarea { min-height: 88px; resize: vertical; }
        .dialog-actions { display: flex; justify-content: flex-end; gap: 9px; border-top: 1px solid var(--line); padding: 14px 21px; }
        .detail-list { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .detail-item span { display: block; margin-bottom: 5px; color: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .detail-item strong { font-size: 13px; overflow-wrap: anywhere; }
        .toast { position: fixed; right: 22px; bottom: 22px; z-index: 10; border-radius: 8px; padding: 12px 16px; background: var(--green); color: white; box-shadow: var(--shadow); animation: toast-in .22s ease-out; }
        @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 1050px) {
            .sidebar { width: 210px; }
            .main-area { margin-left: 210px; }
            .content { padding-inline: 24px; }
            .topbar { padding-inline: 24px; }
            .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .event-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 720px) {
            .sidebar { position: sticky; inset: 0 0 auto; width: 100%; padding: 12px 13px 10px; }
            .brand { padding: 0 3px 12px; }
            .brand-mark { width: 34px; height: 34px; }
            .nav-label, .sidebar-bottom { display: none; }
            .nav-list { display: flex; overflow-x: auto; gap: 5px; scrollbar-width: none; }
            .nav-list::-webkit-scrollbar { display: none; }
            .nav-link { min-height: 37px; flex: 0 0 auto; gap: 7px; padding: 0 10px; font-size: 11px; }
            .nav-icon { width: auto; font-size: 14px; }
            .main-area { margin-left: 0; }
            .topbar { position: static; height: 53px; padding-inline: 16px; }
            .content { padding: 24px 15px 36px; }
            .page-heading { align-items: flex-start; flex-direction: column; margin-bottom: 19px; }
            h1 { font-size: 23px; }
            .stats-grid { gap: 9px; }
            .stat-card { min-height: 112px; padding: 13px; }
            .stat-value { font-size: 22px; }
            .dashboard-grid, .event-grid { grid-template-columns: 1fr; }
            .toolbar { align-items: stretch; }
            .toolbar-group { width: 100%; }
            .search-control { width: 100%; }
            .toolbar-group select { flex: 1; }
            .toolbar > .button { width: 100%; }
            .form-grid { grid-template-columns: 1fr; }
            .form-field.full { grid-column: auto; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="brand" href="Round%202%20.html" target="_top" aria-label="Endeavour school website">
                <span class="brand-mark" aria-hidden="true">E</span>
                <span><span class="brand-name">Endeavour</span><span class="brand-caption">School administration</span></span>
            </a>
            <div class="nav-label">Workspace</div>
            <nav class="nav-list" aria-label="Admin navigation">
                <button class="nav-link active" data-page="overview"><span class="nav-icon">⌂</span>Overview</button>
                <button class="nav-link" data-page="admissions"><span class="nav-icon">＋</span>Admissions</button>
                <button class="nav-link" data-page="students"><span class="nav-icon">♧</span>Students</button>
                <button class="nav-link" data-page="events"><span class="nav-icon">▦</span>Events</button>
            </nav>
            <div class="sidebar-bottom">
                <div class="admin-profile">
                    <span class="avatar">AD</span>
                    <span><span class="profile-name">School Admin</span><span class="profile-role">Administrator</span></span>
                </div>
            </div>
        </aside>

        <div class="main-area">
            <header class="topbar">
                <div class="breadcrumb">Endeavour International <span aria-hidden="true">/</span> <strong id="breadcrumbPage">Overview</strong></div>
                <div class="top-actions">
                    <button class="icon-button" id="themeToggle" aria-label="Toggle color theme" title="Toggle color theme">◐</button>
                    <a class="button secondary small" href="Round%202%20.html" target="_top">View school site <span aria-hidden="true">↗</span></a>
                </div>
            </header>
            <main class="content" id="mainContent" tabindex="-1"></main>
        </div>
    </div>

    <dialog id="appDialog" aria-labelledby="dialogTitle"></dialog>
    <div id="toastRegion" aria-live="polite" aria-atomic="true"></div>

    <script>
        const storageKeys = {
            admissions: 'endeavourAdmissions',
            events: 'endeavourAdminEvents',
            theme: 'endeavourAdminTheme'
        };
        const demoAdmissions = [
            { id: 'demo-1', guardian: 'Aarav Mehta', child: 'Diya Mehta', grade: 'Grade 6', email: 'aarav.mehta@example.com', phone: '9876501201', source: 'School website', date: '2026-10-10', status: 'New' },
            { id: 'demo-2', guardian: 'Nisha Kapoor', child: 'Kabir Kapoor', grade: 'Grade 3', email: 'nisha.kapoor@example.com', phone: '9876501202', source: 'Friend', date: '2026-10-09', status: 'Contacted' },
            { id: 'demo-3', guardian: 'Rohan Sharma', child: 'Anaya Sharma', grade: 'Grade 9', email: 'rohan.sharma@example.com', phone: '9876501203', source: 'Social media', date: '2026-10-08', status: 'Visit scheduled' }
        ];
        const students = [
            { id: 'EIS-2601', name: 'Aditi Verma', grade: 'Grade 8', section: 'A', guardian: 'Sanjay Verma', email: 'sanjay.verma@example.com', status: 'Active' },
            { id: 'EIS-2602', name: 'Ishaan Rao', grade: 'Grade 5', section: 'B', guardian: 'Meera Rao', email: 'meera.rao@example.com', status: 'Active' },
            { id: 'EIS-2603', name: 'Myra Jain', grade: 'Grade 11', section: 'A', guardian: 'Kunal Jain', email: 'kunal.jain@example.com', status: 'Active' },
            { id: 'EIS-2604', name: 'Arjun Nair', grade: 'Grade 7', section: 'C', guardian: 'Leena Nair', email: 'leena.nair@example.com', status: 'Active' },
            { id: 'EIS-2605', name: 'Sara Khan', grade: 'Grade 2', section: 'A', guardian: 'Farah Khan', email: 'farah.khan@example.com', status: 'Active' }
        ];
        const demoEvents = [
            { id: 'event-1', title: 'Campus Open House', date: '2026-11-10', description: 'Welcome prospective families for a guided campus visit and school introduction.' },
            { id: 'event-2', title: 'Admission Offers', date: '2026-12-01', description: 'Admission decisions and offer letters shared with shortlisted families.' },
            { id: 'event-3', title: 'First Day of Classes', date: '2027-04-05', description: 'Opening day for the 2026-27 academic session.' }
        ];
        const readStore = (key, fallback) => {
            try {
                const stored = localStorage.getItem(key);
                return stored === null ? fallback : JSON.parse(stored);
            } catch (error) {
                return fallback;
            }
        };
        const writeStore = (key, value) => {
            try {
                localStorage.setItem(key, JSON.stringify(value));
                return true;
            } catch (error) {
                showToast('This browser could not save the change.');
                return false;
            }
        };
        let admissions = readStore(storageKeys.admissions, null);
        let events = readStore(storageKeys.events, null);
        if (!Array.isArray(admissions)) admissions = demoAdmissions;
        if (!Array.isArray(events)) events = demoEvents;
        writeStore(storageKeys.admissions, admissions);
        writeStore(storageKeys.events, events);

        const mainContent = document.getElementById('mainContent');
        const appDialog = document.getElementById('appDialog');
        let currentPage = 'overview';
        let admissionQuery = '';
        let admissionStatus = 'All statuses';
        let studentQuery = '';
        let toastTimer;

        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
        }
        function initials(name) {
            return String(name || '?').split(/\s+/).slice(0, 2).map((part) => part[0] || '').join('').toUpperCase();
        }
        function formatDate(value) {
            if (!value) return 'Not set';
            const date = new Date(`${value}T00:00:00`);
            return Number.isNaN(date.getTime()) ? escapeHTML(value) : date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
        }
        function showToast(message) {
            const region = document.getElementById('toastRegion');
            region.innerHTML = `<div class="toast" role="status">${escapeHTML(message)}</div>`;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { region.innerHTML = ''; }, 2800);
        }
        function statusOptions(selected) {
            return ['New', 'Contacted', 'Visit scheduled', 'Admitted', 'Closed'].map((status) =>
                `<option value="${status}" ${selected === status ? 'selected' : ''}>${status}</option>`
            ).join('');
        }
        function personCell(name, detail) {
            return `<div class="person-cell"><span class="avatar">${escapeHTML(initials(name))}</span><span><span class="cell-main">${escapeHTML(name)}</span><span class="cell-sub">${escapeHTML(detail)}</span></span></div>`;
        }
        function admissionRows(items) {
            if (!items.length) return '<tr><td class="empty-state" colspan="6">No enquiries match this search.</td></tr>';
            return items.map((lead) => `<tr>
                <td>${personCell(lead.guardian, `Child: ${lead.child}`)}</td>
                <td>${escapeHTML(lead.grade)}</td>
                <td>${escapeHTML(lead.email)}</td>
                <td>${formatDate(lead.date)}</td>
                <td><select class="status-select" data-status-id="${escapeHTML(lead.id)}" aria-label="Update status for ${escapeHTML(lead.guardian)}">${statusOptions(lead.status || 'New')}</select></td>
                <td><button class="text-button" data-action="view-lead" data-id="${escapeHTML(lead.id)}">Details</button></td>
            </tr>`).join('');
        }
        function renderOverview() {
            const newCount = admissions.filter((lead) => (lead.status || 'New') === 'New').length;
            const activeCount = admissions.filter((lead) => !['Admitted', 'Closed'].includes(lead.status)).length;
            const percentages = [34, 51, 43, 68, 57, 82, Math.max(24, Math.min(94, admissions.length * 13))];
            const labels = ['May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov'];
            const recent = [...admissions].slice(0, 4);
            mainContent.innerHTML = `<div class="page-heading"><div><p class="eyebrow">Monday, 12 October 2026</p><h1>Good morning, Admin</h1><p class="subtitle">Here is what is happening at Endeavour today.</p></div><button class="button gold" data-action="new-admission">＋ New enquiry</button></div>
                <section class="stats-grid" aria-label="School overview">
                    <button class="stat-card" data-page="admissions"><span><span class="stat-label">Total enquiries</span><span class="stat-value">${admissions.length}</span><span class="stat-note">Open the admissions list</span></span><span class="stat-icon">＋</span></button>
                    <button class="stat-card" data-page="admissions"><span><span class="stat-label">Needs follow-up</span><span class="stat-value">${newCount}</span><span class="stat-note">New enquiries to review</span></span><span class="stat-icon">◷</span></button>
                    <button class="stat-card" data-page="students"><span><span class="stat-label">Active students</span><span class="stat-value">${students.length}</span><span class="stat-note">Across Grades 1-12</span></span><span class="stat-icon">♧</span></button>
                    <button class="stat-card" data-page="events"><span><span class="stat-label">Active applications</span><span class="stat-value">${activeCount}</span><span class="stat-note">Not yet admitted or closed</span></span><span class="stat-icon">▦</span></button>
                </section>
                <div class="dashboard-grid">
                    <section class="panel"><div class="panel-heading"><div><h2>Admission enquiries</h2><p>New enquiries received this term</p></div><button class="text-button" data-page="admissions">View all →</button></div><div class="panel-body"><div class="chart" aria-label="Illustrative monthly enquiry activity">${percentages.map((height, index) => `<div class="chart-column"><span class="chart-bar" style="height:${height}%"></span>${labels[index]}</div>`).join('')}</div></div></section>
                    <section class="panel"><div class="panel-heading"><div><h2>Recent activity</h2><p>Latest admissions updates</p></div></div><div class="panel-body"><div class="activity-list">${recent.length ? recent.map((lead) => `<div class="activity-item"><span class="activity-dot"></span><div class="activity-copy"><strong>${escapeHTML(lead.child)} · ${escapeHTML(lead.grade)}</strong>${escapeHTML(lead.status || 'New')} enquiry from ${escapeHTML(lead.guardian)}<br>${formatDate(lead.date)}</div></div>`).join('') : '<p class="subtitle">No enquiries yet.</p>'}</div></div></section>
                </div>
                <p class="notice">The dashboard stores demo records in this browser. It is not connected to a secure server or user authentication.</p>`;
        }
        function renderAdmissions() {
            const normalizedQuery = admissionQuery.trim().toLowerCase();
            const filtered = admissions.filter((lead) => {
                const matchesQuery = [lead.guardian, lead.child, lead.grade, lead.email, lead.phone].some((field) => String(field || '').toLowerCase().includes(normalizedQuery));
                return matchesQuery && (admissionStatus === 'All statuses' || (lead.status || 'New') === admissionStatus);
            });
            mainContent.innerHTML = `<div class="page-heading"><div><p class="eyebrow">Enrolment management</p><h1>Admissions</h1><p class="subtitle">Review enquiries and keep each family’s next step up to date.</p></div><button class="button gold" data-action="new-admission">＋ Add enquiry</button></div>
                <section class="panel"><div class="toolbar"><div class="toolbar-group"><input class="field-control search-control" id="admissionSearch" type="search" placeholder="Search name, grade or email" value="${escapeHTML(admissionQuery)}" aria-label="Search admissions"><select class="field-control" id="statusFilter" aria-label="Filter by status"><option>All statuses</option>${['New', 'Contacted', 'Visit scheduled', 'Admitted', 'Closed'].map((status) => `<option ${admissionStatus === status ? 'selected' : ''}>${status}</option>`).join('')}</select></div><button class="button secondary small" data-action="export-admissions">↓ Export CSV</button></div>
                <div class="table-wrap"><table><thead><tr><th>Parent / student</th><th>Grade</th><th>Email</th><th>Received</th><th>Status</th><th></th></tr></thead><tbody>${admissionRows(filtered)}</tbody></table></div></section>
                <p class="notice">Changes are saved in browser storage on this device. Connect a server and authentication before using real student or family data.</p>`;
        }
        function renderStudents() {
            const query = studentQuery.trim().toLowerCase();
            const filtered = students.filter((student) => [student.name, student.id, student.grade, student.guardian].some((field) => field.toLowerCase().includes(query)));
            const rows = filtered.length ? filtered.map((student) => `<tr><td>${personCell(student.name, student.id)}</td><td>${escapeHTML(student.grade)}</td><td>${escapeHTML(student.section)}</td><td>${escapeHTML(student.guardian)}</td><td><span class="status-select">${escapeHTML(student.status)}</span></td><td><button class="text-button" data-action="view-student" data-id="${escapeHTML(student.id)}">Details</button></td></tr>`).join('') : '<tr><td class="empty-state" colspan="6">No students match this search.</td></tr>';
            mainContent.innerHTML = `<div class="page-heading"><div><p class="eyebrow">School directory</p><h1>Students</h1><p class="subtitle">Browse the sample student register by name, grade or ID.</p></div></div>
                <section class="panel"><div class="toolbar"><input class="field-control search-control" id="studentSearch" type="search" placeholder="Search student, guardian or ID" value="${escapeHTML(studentQuery)}" aria-label="Search students"><span class="subtitle">${filtered.length} students</span></div><div class="table-wrap"><table><thead><tr><th>Student</th><th>Grade</th><th>Section</th><th>Guardian</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>
                <p class="notice">Student records shown here are sample data for the interface and are not connected to an official school database.</p>`;
        }
        function renderEvents() {
            const sortedEvents = [...events].sort((first, second) => first.date.localeCompare(second.date));
            mainContent.innerHTML = `<div class="page-heading"><div><p class="eyebrow">School calendar</p><h1>Events & dates</h1><p class="subtitle">Keep important admission and school dates in one place.</p></div><button class="button gold" data-action="new-event">＋ Add event</button></div>
                <section class="event-grid">${sortedEvents.length ? sortedEvents.map((event) => `<article class="event-card"><span class="event-date">${formatDate(event.date)}</span><h2>${escapeHTML(event.title)}</h2><p>${escapeHTML(event.description)}</p><button class="text-button" data-action="delete-event" data-id="${escapeHTML(event.id)}">Remove event</button></article>`).join('') : '<div class="panel empty-state">No events yet. Add a date to get started.</div>'}</section>
                <p class="notice">Events are saved in browser storage on this device.</p>`;
        }
        function renderPage() {
            const pages = { overview: renderOverview, admissions: renderAdmissions, students: renderStudents, events: renderEvents };
            pages[currentPage]();
            document.getElementById('breadcrumbPage').textContent = currentPage[0].toUpperCase() + currentPage.slice(1);
            document.querySelectorAll('[data-page]').forEach((element) => element.classList.toggle('active', element.classList.contains('nav-link') && element.dataset.page === currentPage));
        }
        function openForm(type) {
            const isEvent = type === 'event';
            appDialog.innerHTML = `<form id="recordForm" data-type="${type}">
                <div class="dialog-heading"><div><h2 id="dialogTitle">${isEvent ? 'Add school event' : 'Add admission enquiry'}</h2><p>${isEvent ? 'Add an important date to the school calendar.' : 'Create a new family enquiry record.'}</p></div><button type="button" class="icon-button" data-action="close-dialog" aria-label="Close dialog">×</button></div>
                <div class="dialog-content">${isEvent ? `<div class="form-grid"><div class="form-field full"><label for="eventTitle">Event name</label><input id="eventTitle" name="title" required maxlength="80" placeholder="e.g. Parent orientation"></div><div class="form-field"><label for="eventDate">Date</label><input id="eventDate" name="date" type="date" required></div><div class="form-field full"><label for="eventDescription">Details</label><textarea id="eventDescription" name="description" maxlength="240" placeholder="Add a short description"></textarea></div></div>` : `<div class="form-grid"><div class="form-field"><label for="guardianName">Parent / guardian</label><input id="guardianName" name="guardian" required maxlength="80"></div><div class="form-field"><label for="childName">Student name</label><input id="childName" name="child" required maxlength="80"></div><div class="form-field"><label for="grade">Grade</label><select id="grade" name="grade" required><option value="">Select grade</option>${Array.from({ length: 12 }, (_, index) => `<option>Grade ${index + 1}</option>`).join('')}</select></div><div class="form-field"><label for="leadPhone">Phone</label><input id="leadPhone" name="phone" inputmode="numeric" pattern="[0-9]{7,15}" maxlength="15" required></div><div class="form-field full"><label for="leadEmail">Email</label><input id="leadEmail" name="email" type="email" required></div></div>`}</div>
                <div class="dialog-actions"><button type="button" class="button secondary" data-action="close-dialog">Cancel</button><button class="button gold" type="submit">${isEvent ? 'Save event' : 'Save enquiry'}</button></div>
            </form>`;
            appDialog.showModal();
        }
        function showLeadDetails(lead) {
            appDialog.innerHTML = `<div class="dialog-heading"><div><h2 id="dialogTitle">Enquiry details</h2><p>Received ${formatDate(lead.date)}</p></div><button class="icon-button" data-action="close-dialog" aria-label="Close dialog">×</button></div><div class="dialog-content"><div class="detail-list">${[
                ['Parent / guardian', lead.guardian], ['Student', lead.child], ['Date of birth', lead.dob || 'Not provided'], ['Grade applying for', lead.grade],
                ['Email', lead.email], ['Phone', lead.phone || 'Not provided'], ['Previous school', lead.previousSchool || 'Not provided'],
                ['How they heard about us', lead.source || 'Admin entry'], ['Contact consent', lead.consent === true ? 'Granted' : lead.consent === false ? 'Not recorded' : 'Not provided'],
                ['Message / requirements', lead.message || 'Not provided'], ['Submitted', lead.submittedAt ? new Date(lead.submittedAt).toLocaleString() : formatDate(lead.date)], ['Application status', lead.status || 'New']
            ].map(([label, value]) => `<div class="detail-item"><span>${escapeHTML(label)}</span><strong>${escapeHTML(value)}</strong></div>`).join('')}</div></div><div class="dialog-actions"><button class="button secondary" data-action="close-dialog">Close</button></div>`;
            appDialog.showModal();
        }
        function exportAdmissions() {
            const columns = ['guardian', 'child', 'dob', 'grade', 'email', 'phone', 'previousSchool', 'source', 'message', 'consent', 'date', 'submittedAt', 'status'];
            const csvCell = (value) => `"${String(value ?? '').replace(/"/g, '""')}"`;
            const csv = [columns.join(','), ...admissions.map((lead) => columns.map((column) => csvCell(lead[column])).join(','))].join('\r\n');
            const link = document.createElement('a');
            link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
            link.download = 'endeavour-admissions.csv';
            link.click();
            URL.revokeObjectURL(link.href);
            showToast('Admissions CSV exported.');
        }

        function syncAdmissionsToParent() {
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'endeavour-admissions-update', admissions }, '*');
            }
        }

        window.addEventListener('message', (event) => {
            if (event.source !== window.parent || event.data?.type !== 'endeavour-admissions-sync' || !Array.isArray(event.data.admissions)) return;
            admissions = event.data.admissions;
            writeStore(storageKeys.admissions, admissions);
            renderPage();
        });

        document.addEventListener('click', (event) => {
            const target = event.target.closest('[data-page], [data-action]');
            if (!target) return;
            if (target.dataset.page) {
                currentPage = target.dataset.page;
                renderPage();
                return;
            }
            const { action, id } = target.dataset;
            if (action === 'new-admission') openForm('admission');
            if (action === 'new-event') openForm('event');
            if (action === 'close-dialog') appDialog.close();
            if (action === 'export-admissions') exportAdmissions();
            if (action === 'view-lead') {
                const lead = admissions.find((item) => String(item.id) === id);
                if (lead) showLeadDetails(lead);
            }
            if (action === 'view-student') {
                const student = students.find((item) => item.id === id);
                if (student) {
                    appDialog.innerHTML = `<div class="dialog-heading"><div><h2 id="dialogTitle">Student record</h2><p>${escapeHTML(student.id)}</p></div><button class="icon-button" data-action="close-dialog" aria-label="Close dialog">×</button></div><div class="dialog-content"><div class="detail-list">${[['Student', student.name], ['Grade', student.grade], ['Section', student.section], ['Guardian', student.guardian], ['Guardian email', student.email], ['Status', student.status]].map(([label, value]) => `<div class="detail-item"><span>${escapeHTML(label)}</span><strong>${escapeHTML(value)}</strong></div>`).join('')}</div></div><div class="dialog-actions"><button class="button secondary" data-action="close-dialog">Close</button></div>`;
                    appDialog.showModal();
                }
            }
            if (action === 'delete-event') {
                events = events.filter((item) => String(item.id) !== id);
                writeStore(storageKeys.events, events);
                renderPage();
                showToast('Event removed.');
            }
        });
        document.addEventListener('input', (event) => {
            if (event.target.id === 'admissionSearch') {
                admissionQuery = event.target.value;
                renderAdmissions();
                const input = document.getElementById('admissionSearch');
                input.focus();
                input.setSelectionRange(input.value.length, input.value.length);
            }
            if (event.target.id === 'studentSearch') {
                studentQuery = event.target.value;
                renderStudents();
                const input = document.getElementById('studentSearch');
                input.focus();
                input.setSelectionRange(input.value.length, input.value.length);
            }
        });
        document.addEventListener('change', (event) => {
            if (event.target.id === 'statusFilter') {
                admissionStatus = event.target.value;
                renderAdmissions();
            }
            if (event.target.matches('[data-status-id]')) {
                const lead = admissions.find((item) => String(item.id) === event.target.dataset.statusId);
                if (lead) {
                    lead.status = event.target.value;
                    writeStore(storageKeys.admissions, admissions);
                    syncAdmissionsToParent();
                    renderPage();
                    showToast('Enquiry status updated.');
                }
            }
        });
        document.addEventListener('submit', (event) => {
            if (event.target.id !== 'recordForm') return;
            event.preventDefault();
            const formData = new FormData(event.target);
            if (event.target.dataset.type === 'event') {
                events.push({ id: `event-${Date.now()}`, title: formData.get('title').trim(), date: formData.get('date'), description: String(formData.get('description') || '').trim() || 'School event' });
                writeStore(storageKeys.events, events);
                currentPage = 'events';
                appDialog.close();
                renderPage();
                showToast('Event added to the calendar.');
                return;
            }
            admissions.unshift({
                id: Date.now().toString(), guardian: formData.get('guardian').trim(), child: formData.get('child').trim(), grade: formData.get('grade'),
                dob: '', email: formData.get('email').trim(), phone: formData.get('phone').trim(), previousSchool: '', source: 'Admin entry',
                message: '', consent: false, date: new Date().toISOString().slice(0, 10), submittedAt: new Date().toISOString(), status: 'New'
            });
            writeStore(storageKeys.admissions, admissions);
            syncAdmissionsToParent();
            currentPage = 'admissions';
            admissionQuery = '';
            admissionStatus = 'All statuses';
            appDialog.close();
            renderPage();
            showToast('Admission enquiry added.');
        });
        document.getElementById('themeToggle').addEventListener('click', () => {
            document.body.classList.toggle('dark');
            writeStore(storageKeys.theme, document.body.classList.contains('dark') ? 'dark' : 'light');
        });
        if (readStore(storageKeys.theme, 'light') === 'dark') document.body.classList.add('dark');
        appDialog.addEventListener('click', (event) => {
            if (event.target === appDialog) appDialog.close();
        });
        renderPage();
    </script>
</body>
</html>
